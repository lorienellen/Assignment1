  <!--MAIN SECTION-->
  <h2 class="m-4">DEMO: Show Statistics Based on Product Info</h2>

  <!--Insert chatJS library: https://www.chartjs.org/  -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> 

  <div class="container">
    <div class="row">

      <!-- Chart: Products by Category -->
      <div class="col-lg-4">
        <div class="card shadow">
          <div class="card-header">Chart: Products by Category</div>
          <div class="card-body text-center">          
            <div style="max-width: 400px; margin: 0 auto;">
              <!--Add canvas element-->
              <canvas id="category-chart" ></canvas>
            </div>
          </div>
        </div>                    
      </div>
      
      <!-- Chart: Average rating per products -->
      <div class="col-lg-4">   
        <div class="card shadow">
          <div class="card-header">Chart: Average of Rating per Product</div>     
          <div class="card-body text-center">  
            <div style="max-width: 400px; margin: 0 auto;">
              <!--Add canvas element-->
              <canvas id="rating-chart" ></canvas>
            </div>
          </div>  
        </div>
      </div>

      <!-- Chart: Inventory Stock Level -->
      <div class="col-lg-4">
        <div class="card shadow">
            <div class="card-header">Chart: Inventory Stock Levels</div>
            <div class="card-body text-center">
              <div style="max-width: 400px; margin: 0 auto;">
                <!--Add canvas element-->
                <canvas id="stock-chart" ></canvas>
              </div>
            </div>
        </div>
        </div>
    </div>
  </div>
